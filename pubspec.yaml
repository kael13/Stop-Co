name: stop_co
description: "A minimalist GPS-based destination alarm app for commuters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1

  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  collection: ^1.19.1
  uuid: ^4.5.1
  shared_preferences: ^2.4.0
  lottie: ^3.3.0
  screen_brightness: ^2.1.11
  wakelock_plus: ^1.6.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  table_calendar: ^3.2.0
  cloud_functions: ^5.2.0
  firebase_core: ^3.15.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/animations/

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
